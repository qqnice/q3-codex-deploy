name: q3-llm

services:
  ollama:
    image: ollama/ollama:0.40.12
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 6g
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 2g
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      WEBUI_URL: "https://q3.qqnas.org"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?請先建立密鑰}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?請先設定管理員信箱}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?請先設定初始密碼}
      ENABLE_SIGNUP: "false"
      CORS_ALLOW_ORIGIN: "https://q3.qqnas.org"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      WEBUI_SESSION_COOKIE_SECURE: "true"
    volumes:
      - openwebui-data:/app/backend/data
    networks:
      ai: {}
      proxy:
        aliases:
          - q3-open-webui
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-data:
  openwebui-data:

networks:
  ai: {}
  proxy:
    external: true
    name: q3-proxy
